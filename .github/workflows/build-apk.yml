
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Fix splash screen color
        shell: bash
        run: |
          FILE="android/app/src/main/res/values/colors.xml"

          mkdir -p "$(dirname "$FILE")"

          if [ ! -f "$FILE" ]; then
            echo '<resources></resources>' > "$FILE"
          fi

          if grep -q 'name="splashscreen_background"' "$FILE"; then
            sed -i 's|<color name="splashscreen_background">[^<]*</color>|<color name="splashscreen_background">#FFFFFF</color>|' "$FILE"
          else
            sed -i 's|</resources>|  <color name="splashscreen_background">#FFFFFF</color>\n</resources>|' "$FILE"
          fi

          echo "----- colors.xml -----"
          cat "$FILE"

          echo "----- splashscreen.xml -----"
          cat android/app/src/main/res/drawable/splashscreen.xml

          echo "----- Verify required color -----"
          grep -q 'name="splashscreen_background"' "$FILE"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: savoria-restaurant-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
