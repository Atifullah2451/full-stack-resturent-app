
      - name: Diagnose and fix splash resources
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Current directory ==="
          pwd

          echo "=== Resource files ==="
          find android/app/src/main/res -type f \( -name "colors.xml" -o -name "splashscreen.xml" \)

          echo "=== colors.xml before fix ==="
          cat android/app/src/main/res/values/colors.xml

          echo "=== splashscreen.xml ==="
          cat android/app/src/main/res/drawable/splashscreen.xml

          echo "=== Add missing color ==="
          python3 - <<'PY'
          from pathlib import Path
          import re

          colors = Path("android/app/src/main/res/values/colors.xml")
          colors.parent.mkdir(parents=True, exist_ok=True)

          if not colors.exists():
              colors.write_text("<resources>\n</resources>\n")

          content = colors.read_text()

          if re.search(r'name="splashscreen_background"', content):
              content = re.sub(
                  r'<color\s+name="splashscreen_background">.*?</color>',
                  '<color name="splashscreen_background">#FFFFFF</color>',
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  "</resources>",
                  '  <color name="splashscreen_background">#FFFFFF</color>\n</resources>'
              )

          colors.write_text(content)
          print(colors.read_text())

          assert re.search(r'<color\s+name="splashscreen_background">\s*#FFFFFF\s*</color>', content), \
              "Required splash color is missing"
          PY

          echo "=== Verify all resource references ==="
          grep -R -n "splashscreen_background" android/app/src/main/res
