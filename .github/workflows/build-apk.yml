name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: DIAGNOSE splash resources
        run: |
          echo "=== latest commit ==="
          git log -1 --oneline
          echo "=== app.json splash config ==="
          node -e "console.log(JSON.stringify(require('./app.json').expo.splash ?? null, null, 2))"
          echo "=== assets ==="
          ls -la assets
          echo "=== Android resource folders ==="
          find android/app/src/main/res -maxdepth 2 -type d | sort
          echo "=== splashscreen.xml ==="
          cat android/app/src/main/res/drawable/splashscreen.xml
          echo "=== all colors.xml files ==="
          find android/app/src/main/res -type f -name colors.xml -print -exec cat {} \;
          echo "=== splashscreen_background references and definitions ==="
          grep -RIn "splashscreen_background" android/app/src/main/res || true

      - name: Ensure splash color exists
        run: |
          resource_dir="android/app/src/main/res"
          if ! grep -Rqs '<color[^>]*name="splashscreen_background"' "$resource_dir"/values*; then
            mkdir -p "$resource_dir/values"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="splashscreen_background">#FFFFFF</color>\n</resources>\n' > android/app/src/main/res/values/splash_fix.xml
            echo "added fallback color"
          else
            echo "color already defined"
          fi
          grep -RIn '<color[^>]*name="splashscreen_background"' "$resource_dir"/values*

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: savoria-restaurant-apk-${{ github.sha }}
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error