
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Fix splash resources
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          colors = Path("android/app/src/main/res/values/colors.xml")
          splash = Path("android/app/src/main/res/drawable/splashscreen.xml")

          assert splash.exists(), f"Missing file: {splash}"
          content = colors.read_text() if colors.exists() else "<resources>\n</resources>\n"

          if re.search(r'name="splashscreen_background"', content):
              content = re.sub(
                  r'<color\s+name="splashscreen_background">.*?</color>',
                  '<color name="splashscreen_background">#FFFFFF</color>',
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  "</resources>",
                  '  <color name="splashscreen_background">#FFFFFF</color>\n</resources>'
              )

          colors.parent.mkdir(parents=True, exist_ok=True)
          colors.write_text(content)

          print("=== colors.xml ===")
          print(colors.read_text())
          print("=== splashscreen.xml ===")
          print(splash.read_text())

          assert 'name="splashscreen_background"' in colors.read_text()
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: savoria-restaurant-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
